<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mexico Road Trip — Stays Tracker</title>
<style>
  :root{
    --paper:#F5F2EC; --card:#FFFFFF; --ink:#241B20; --muted:#8C857E; --line:#E4DDD2;
    --rosa:#D23C77; --agave:#2F8F83; --amber:#C77B22; --sky:#2D6E9E;
    --rosa-soft:#FBEAF1; --agave-soft:#E4F2F0; --amber-soft:#F8EEDD; --sky-soft:#E3EEF6; --grey-soft:#ECE8E1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; padding:0 0 56px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 0}
  header{padding:6px 2px 14px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rosa);font-weight:700}
  h1{font-weight:800;font-size:30px;line-height:1.02;margin:6px 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px}

  .summary{display:flex;gap:8px;margin-top:16px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
  .stat .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .stat .v{font-size:18px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
  .stat .v small{font-size:11px;font-weight:600;color:var(--muted);display:block;letter-spacing:0}
  .grand{margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}
  .grand b{color:var(--ink);font-weight:800}

  .tabs{display:flex;gap:6px;margin:18px 2px 4px}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:11px;border:1px solid var(--line);
    background:var(--card);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .seg-label{display:flex;align-items:center;gap:8px;margin:26px 2px 6px;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--rosa);font-weight:700}
  .seg-label .rule{flex:1;height:1px;background:var(--line)}

  .car{display:flex;align-items:center;gap:10px;background:var(--grey-soft);border:1px dashed #cdc6bb;
    border-radius:13px;padding:11px 13px;margin:12px 2px}
  .car .ico{font-size:18px}
  .car .body{flex:1;min-width:0}
  .car .rt{font-weight:800;font-size:14px}
  .car .dt{font-size:12px;color:var(--muted);margin-top:1px}
  .car .tag{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    background:#fff;border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:20px;white-space:nowrap}

  .flight{display:flex;align-items:center;gap:10px;background:var(--sky-soft);border:1px solid #cfe0ec;
    border-radius:13px;padding:11px 13px;margin:12px 2px}
  .flight .ico{font-size:18px}
  .flight .body{flex:1;min-width:0}
  .flight .rt{font-weight:800;font-size:14px}
  .flight .dt{font-size:12px;color:var(--muted);margin-top:1px}

  .stop{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:12px 2px;
    position:relative}
  .stop.booked{background:var(--agave-soft);border-color:#bfe0db}
  .stop.pending{background:var(--amber-soft);border-color:#ecd5ad}
  .stop .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .stop .city{font-weight:800;font-size:18px;letter-spacing:-.01em}
  .stop .nights{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
  .stop .why{font-size:12px;color:var(--muted);margin-top:3px}
  .badge{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:20px;white-space:nowrap}
  .badge.b{background:var(--agave);color:#fff}
  .badge.p{background:var(--amber);color:#fff}
  .badge.o{background:var(--grey-soft);color:var(--muted)}

  .pick{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .pick .name{font-weight:700;font-size:14px}
  .pick .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .pick .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px}
  .conf{font-size:11px;color:var(--muted)}
  .conf b{color:var(--ink)}
  .cancel{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--agave)}
  .warn{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--amber)}

  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .lk{font-size:11.5px;font-weight:700;text-decoration:none;padding:5px 9px;border-radius:9px;border:1px solid var(--line);color:var(--ink);background:#fff}
  .lk.maps{color:var(--sky)}
  .lk.book{color:var(--rosa)}

  .note{font-size:12px;color:var(--muted);background:var(--card);border:1px dashed var(--line);
    border-radius:12px;padding:10px 12px;margin:14px 2px}
  .note b{color:var(--ink)}

  .hide{display:none}
  a{color:inherit}
  .err{margin:20px 2px;padding:14px;border-radius:12px;background:#FBEAF1;border:1px solid #f0c8d9;color:#8a2350;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"></header>

  <div class="tabs">
    <div class="tab on" data-tab="route" onclick="sw('route')">Route</div>
    <div class="tab" data-tab="open" onclick="sw('open')">Open stops</div>
  </div>

  <div id="route"></div>
  <div id="open" class="hide"></div>
</div>

<script>
/* ------------------------------------------------------------------
   All trip content lives in data.json. Edit that file, not this one.
   Block types: seg | flight | car | stop | note
   ------------------------------------------------------------------ */

function sw(t){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on', x.dataset.tab === t)});
  document.getElementById('route').classList.toggle('hide', t !== 'route');
  document.getElementById('open').classList.toggle('hide', t !== 'open');
}

function linksHTML(links){
  if(!links || !links.length) return '';
  return '<div class="links">' + links.map(function(l){
    return '<a class="lk ' + (l.cls || '') + '" href="' + l.href + '" target="_blank">' + l.text + '</a>';
  }).join('') + '</div>';
}

function pickHTML(p){
  if(!p) return '';
  var h = '<div class="pick">';
  if(p.name) h += '<div class="name">' + p.name + '</div>';
  if(p.meta) h += '<div class="meta">' + p.meta + '</div>';
  if(p.conf) h += '<div class="row"><span class="conf">' + p.conf + '</span></div>';
  (p.ok   || []).forEach(function(t){ h += '<span class="cancel">✓ ' + t + '</span><br>'; });
  (p.warn || []).forEach(function(t){ h += '<span class="warn">⚠ ' + t + '</span><br>'; });
  h += linksHTML(p.links);
  h += '</div>';
  return h;
}

function blockHTML(b){
  switch(b.type){
    case 'seg':
      return '<div class="seg-label">' + b.label + '<span class="rule"></span></div>';

    case 'flight':
      return '<div class="flight"><span class="ico">✈</span><div class="body">' +
             '<div class="rt">' + b.rt + '</div><div class="dt">' + b.dt + '</div></div></div>';

    case 'car':
      return '<div class="car"><span class="ico">🚗</span><div class="body">' +
             '<div class="rt">' + b.rt + '</div><div class="dt">' + b.dt + '</div></div>' +
             (b.tag ? '<span class="tag">' + b.tag + '</span>' : '') + '</div>';

    case 'note':
      return '<div class="note">' + b.html + '</div>';

    case 'stop':
      var h = '<div class="stop ' + (b.state || '') + '"><div class="top"><div>' +
              '<div class="city">' + b.city + '</div>' +
              '<div class="nights">' + (b.nights || '') + '</div>';
      if(b.why) h += '<div class="why">' + b.why + '</div>';
      h += '</div>';
      if(b.badge) h += '<span class="badge ' + b.badge.cls + '">' + b.badge.text + '</span>';
      h += '</div>';
      h += pickHTML(b.pick);
      if(!b.pick) h += linksHTML(b.links);
      h += '</div>';
      return h;

    default:
      return '';
  }
}

function renderHeader(hd){
  var h = '<div class="eyebrow">' + hd.eyebrow + '</div>' +
          '<h1>' + hd.title + '</h1>' +
          '<div class="sub">' + hd.sub + '</div><div class="summary">';
  hd.stats.forEach(function(s){
    h += '<div class="stat"><div class="k">' + s.k + '</div><div class="v">' + s.v +
         '<small>' + s.small + '</small></div></div>';
  });
  h += '</div><div class="grand">' + hd.grand + '</div>';
  document.getElementById('hdr').innerHTML = h;
}

fetch('data.json?v=' + Date.now())
  .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(d){
    renderHeader(d.header);
    document.getElementById('route').innerHTML = d.route.map(blockHTML).join('');
    document.getElementById('open').innerHTML  = d.open.map(blockHTML).join('');
  })
  .catch(function(e){
    document.getElementById('route').innerHTML =
      '<div class="err">Could not load <b>data.json</b> — ' + e.message + '</div>';
  });
</script>
</body>
</html>
